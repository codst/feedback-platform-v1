<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Feedback Platform</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'index' %}">Feedback Platform</a>

            <div>
                <a href="{% url 'index' %}#explore">Explore</a>
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-card">
            <h1>Password Reset Complete</h1>
            <p style="color: #666; margin-bottom: 32px;">
                Your password has been set. You may now log in with your new credentials.
            </p>
            <a href="{% url 'login' %}" class="submit-btn" style="display: inline-block; text-align: center; text-decoration: none;">Log In</a>
        </section>
    </main>

    <footer>
        <p>Your Platform</p>
    </footer>

</body>

</html>
